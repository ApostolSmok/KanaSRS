<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kana SRS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="language-selector">
    <button id="lang-ru" class="active">RU</button>
    <button id="lang-en">EN</button>
</div>

<div id="app">
    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="start-screen">
        <h2 id="ui-title">Настройки обучения</h2>
        
        <div class="setting-group">
            <p id="ui-alphabet-text">Выберите азбуку:</p>
            <div id="alphabet-selector">
                <button id="btn-hira" class="active">Хирагана</button>
                <button id="btn-kata">Катакана</button>
            </div>
        </div>

        <div class="setting-group">
            <p id="ui-mode-text">Выберите режим:</p>
            <div id="mode-selector">
                <button id="btn-manual" class="active">✍️ Ввод текста</button>
                <button id="btn-quiz">🎯 Тест (4 варианта)</button>
                <button id="btn-learn">🃏 Карточки</button>
            </div>
        </div>

        <button id="start-btn">Начать!</button>
    </div>

    <!-- ЭКРАН 2: ОБУЧЕНИЕ -->
    <div id="study-screen" style="display: none;">
        <button id="back-btn">⬅ В меню</button>
        
        <div id="card">
            <h1 id="character">?</h1>
            
            <div id="learning-container" style="display: none;">
            <div id="flashcard" class="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <h1 id="learn-char">?</h1>
                        <p class="flip-hint" id="ui-flip-hint">Нажми, чтобы перевернуть</p>
                    </div>
                    <div class="flashcard-back">
                        <h1 id="learn-romaji">?</h1>
                    </div>
                </div>
            </div>
            
            <div id="learning-buttons" class="learning-buttons" style="display: none;">
                <button id="btn-learn-wrong" class="btn-wrong">✖ Не помню</button>
                <button id="btn-learn-correct" class="btn-correct">✔ Помню</button>
            </div>
        </div>

            <div id="manual-container">
                <input type="text" id="answer" autocomplete="off" placeholder="Введите ромадзи">
                <button id="check-btn">Проверить</button>
            </div>

            <div id="quiz-container" style="display: none;">
                <button class="quiz-option"></button>
                <button class="quiz-option"></button>
                <button class="quiz-option"></button>
                <button class="quiz-option"></button>
            </div>

            <p id="feedback"></p>
        </div>
    </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
